[project]
name = "pipguard"
version = "0.1.0.dev0"
description = "CI gate that judges a Python dependency by what it does"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7,<3",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
]

[project.scripts]
pipguard = "pipguard.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
# Training/eval scripts; installed by default so their unit tests run. The corpus
# evaluation itself runs locally, never in CI (PRD: compute plan).
eval = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]

[tool.uv]
default-groups = ["dev", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker' --strict-markers"
markers = [
    "docker: needs a local Docker daemon; run with `uv run pytest -m docker`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["tests/fixtures", "**/.venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
