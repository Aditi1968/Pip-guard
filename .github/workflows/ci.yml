name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token for every job (PRD: CI trust model). Never pull_request_target.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - run: uv sync --locked
      - run: uv run pytest --cov=pipguard --cov-report=term-missing

  # Reproducibility criterion: after `uv sync`, tests pass with the network disabled.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - run: uv sync --locked
      - name: pytest in a network namespace with no interfaces
        run: |
          # unshare needs unprivileged user namespaces; ubuntu-latest restricts them via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user --net -- env UV_OFFLINE=1 .venv/bin/pytest -q

  # Week-1 spike and Docker-marked tests on the PRD's real target runner.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - run: uv sync --locked
      - run: docker build -f sandbox/sandbox.Dockerfile -t pipguard-sandbox:dev .
      - run: bash sandbox/spike.sh pipguard-sandbox:dev
      - run: uv run pytest -m docker -q
